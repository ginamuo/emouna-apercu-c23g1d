<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 840" role="img" aria-labelledby="title desc">
<title id="title">L’enveloppe anniversaire Emouna, illustration provisoire</title><desc id="desc">Un ensemble de cartes illustrées, de photos dessinées, de feuilles délicates et d’une enveloppe cachetée symbolisant les souvenirs reçus chaque année.</desc>
